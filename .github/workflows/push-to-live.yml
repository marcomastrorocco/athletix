name: Push repo content to live

# The REVERSE of sync-content.yml: pushes content committed in the repo
# (data/*.json) up to the live site (Vercel Blob), so a local `git push`
# shows up on the live site automatically. Uses a 3-way merge, so anything
# the client edited via the live admin dashboard is preserved.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      files:
        description: "Space-separated files to push (e.g. 'site.json'). Empty = all."
        required: false
        default: ""
      overwrite:
        description: "Overwrite live (skip 3-way merge). WARNING: drops un-synced client edits to those files."
        type: boolean
        required: false
        default: false

# Read-only repo access is enough — this job only writes to Blob, not git.
permissions:
  contents: read

# Never run two pushes to live at once.
concurrency:
  group: push-to-live
  cancel-in-progress: false

jobs:
  push-live:
    # Skip the auto-sync bot's own commits, otherwise Blob -> repo (sync-content)
    # -> Blob (this) would loop on every scheduled sync.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so github.event.before resolves for multi-commit pushes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Merge-push data/*.json to live Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_FILES: ${{ github.event.inputs.files }}
          INPUT_OVERWRITE: ${{ github.event.inputs.overwrite }}
        run: |
          ARGS=()
          if [ "$EVENT_NAME" = "push" ]; then
            # Apply every commit in this push (before -> after), not just HEAD~1,
            # so a multi-commit push doesn't silently drop earlier changes.
            if [ -n "$EVENT_BEFORE" ] && ! echo "$EVENT_BEFORE" | grep -qE '^0+$'; then
              ARGS+=("--base-ref=$EVENT_BEFORE")
            fi
          else
            # Manual run: optional overwrite + targeted files.
            [ "$INPUT_OVERWRITE" = "true" ] && ARGS+=("--overwrite")
            if [ -n "$INPUT_FILES" ]; then
              # shellcheck disable=SC2206
              ARGS+=($INPUT_FILES)
            fi
          fi
          echo "Running: npm run push-live -- ${ARGS[*]}"
          npm run push-live -- "${ARGS[@]}"
